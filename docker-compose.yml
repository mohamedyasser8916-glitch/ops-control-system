version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ops_admin
      POSTGRES_PASSWORD: changeme_local_password
      POSTGRES_DB: ops_control
    ports:
      - "5432:5432"
    volumes:
      - ops_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_admin -d ops_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://ops_admin:changeme_local_password@db:5432/ops_control?schema=public"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-please-change-me-in-.env}"
      NEXTAUTH_URL: "http://localhost:3000"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@example.com}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-ChangeMe123!}"
    ports:
      - "3000:3000"

volumes:
  ops_db_data:
